[project]
name = "midiator"
version = "0.2.0"
description = "Turn MIDI devices into Windows keyboard and mouse input, with a built-in Genshin Impact instrument preset."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# This is a fork. AJ Stensland wrote the original MIDIator, and the MIT licence
# requires keeping that attribution; the second entry is the fork's maintainer.
authors = [
    { name = "AJ Stensland" },
    { name = "huarkiou" },
]
keywords = ["midi", "windows", "input", "genshin", "lyre", "keyboard"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mido>=1.3.0",
    "python-rtmidi>=1.5.0",
]

[project.urls]
"Upstream (original MIDIator)" = "https://github.com/ajstensland/MIDIator"
Repository = "https://github.com/huarkiou/midiator-genshin"

[project.scripts]
midiator = "midiator.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
    "ty>=0.0.1a1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/midiator"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
